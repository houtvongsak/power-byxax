name: Sync with Omarchy

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: power-byxax-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
      main: ${{ steps.bundle.outputs.main }}
      upstream: ${{ steps.bundle.outputs.upstream }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find latest stable Omarchy release
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/basecamp/omarchy/releases/latest --jq .tag_name)
          [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "OMARCHY_TAG=$tag" >> "$GITHUB_ENV"
      - name: Fetch official power plugin
        run: |
          git clone -q --depth 1 --branch "$OMARCHY_TAG" --filter=blob:none --sparse \
            https://github.com/basecamp/omarchy.git "$RUNNER_TEMP/omarchy"
          git -C "$RUNNER_TEMP/omarchy" sparse-checkout set shell/plugins/panels/power
      - name: Prepare local merge without publishing permissions
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git checkout -q -B main "$GITHUB_SHA"
          changed=$(bin/sync-stock "$RUNNER_TEMP/omarchy" "$OMARCHY_TAG")
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Install QML parser
        if: steps.merge.outputs.changed == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qt6-declarative-dev-tools
      - name: Validate merged code with read-only permissions
        if: steps.merge.outputs.changed == 'true'
        run: |
          before=$(git rev-parse HEAD)
          bin/check
          test "$(git rev-parse HEAD)" = "$before"
          test -z "$(git status --porcelain)"
      - name: Bundle validated commits
        id: bundle
        if: steps.merge.outputs.changed == 'true'
        run: |
          echo "main=$(git rev-parse main)" >> "$GITHUB_OUTPUT"
          echo "upstream=$(git rev-parse upstream)" >> "$GITHUB_OUTPUT"
          git bundle create "$RUNNER_TEMP/sync.bundle" main upstream
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: steps.merge.outputs.changed == 'true'
        with:
          name: validated-upstream
          path: ${{ runner.temp }}/sync.bundle
          retention-days: 1

  publish:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # This checkout stays on the trusted workflow commit. Candidate code is
      # fetched only as Git objects, never checked out or executed in this job.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: validated-upstream
          path: ${{ runner.temp }}/validated-upstream
      - name: Publish validated merge and patch release
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.sha }}
          MERGED_SHA: ${{ needs.prepare.outputs.main }}
          UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream }}
          OMARCHY_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git --hostname github.com
          python3 bin/publish-sync.py --bundle "$RUNNER_TEMP/validated-upstream/sync.bundle" \
            --base "$BASE_SHA" --main "$MERGED_SHA" --upstream "$UPSTREAM_SHA" \
            --tag "$OMARCHY_TAG" --publish

  report:
    needs: [prepare, publish]
    if: always() && (needs.prepare.result == 'failure' || needs.publish.result == 'failure')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Report failed sync
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OMARCHY_TAG: ${{ needs.prepare.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Omarchy ${OMARCHY_TAG:-release} power sync needs attention"
          if gh issue list --state open --search "in:title \"$title\"" --json title --jq '.[].title' | grep -Fxq "$title"; then exit 0; fi
          body="$RUNNER_TEMP/sync-issue.md"
          printf 'The automatic upstream sync failed. Review the [workflow run](%s).\n\n' "$RUN_URL" > "$body"
          printf 'Main and upstream are published together only after successful validation. For conflicts, fetch the official release shown in the run and resolve locally before publishing.\n' >> "$body"
          gh issue create --title "$title" --body-file "$body"
